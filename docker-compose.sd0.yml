services:
  yqd:
    image: ${APP_IMAGE_BASE_NAME:?}:yqd
    container_name: yqd
    restart: unless-stopped
    env_file: .env.yqd
    cap_drop:
      - ALL
  sylp:
    image: ${APP_IMAGE_BASE_NAME:?}:sylp
    container_name: sylp
    restart: unless-stopped
    env_file: .env.sylp
    cap_drop:
      - ALL
  nginx:
    image: m.daocloud.io/docker.io/library/nginx:latest
    container_name: nginx
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /run:rw,noexec,nosuid,nodev
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.proxy.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx.ssl.conf:/etc/nginx/ssl_params.conf:ro
      - ./certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - yqd
      - sylp
  # Records why any container dies (exit code, OOM, last output lines) in
  # ./logs/container-deaths.log. Restarts are done by the `restart:` policies.
  death-logger:
    image: m.daocloud.io/docker.io/library/docker:cli
    container_name: death-logger
    restart: unless-stopped
    entrypoint: ["sh", "/docker-death-logger.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-death-logger.sh:/docker-death-logger.sh:ro
      - ./logs:/logs
