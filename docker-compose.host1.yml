services:
  yuantu:
    image: ${APP_IMAGE_BASE_NAME:?}:yuantu
    container_name: yuantu
    restart: unless-stopped
    env_file: .env.yuantu
    cap_drop:
      - ALL
  # The container for the "x" white label deployment. Docker doesn't allow
  # single letter container names.
  xx:
    image: ${APP_IMAGE_BASE_NAME:?}:x
    container_name: xx
    restart: unless-stopped
    env_file: .env.x
    cap_drop:
      - ALL
  nginx:
    image: m.daocloud.io/docker.io/library/nginx:latest
    container_name: nginx
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /run:rw,noexec,nosuid,nodev
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.proxy.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx.ssl.conf:/etc/nginx/ssl_params.conf:ro
      - ./certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - yuantu
      - xx
