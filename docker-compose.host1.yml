services:
  yuantu:
    image: ${APP_IMAGE_BASE_NAME:?}.yuantu:latest
    container_name: yuantu
    restart: unless-stopped
    env_file: .env.yuantu
  # The container for the "x" white label deployment. Docker doesn't allow 
  # single letter container names.
  xx:
    image: ${APP_IMAGE_BASE_NAME:?}.x:latest
    container_name: xx
    restart: unless-stopped
    env_file: .env.x
  nginx:
    image: m.daocloud.io/docker.io/library/nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.proxy.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx.ssl.conf:/etc/nginx/ssl_params.conf:ro
      - ./certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - yuantu
      - xx
  # Records why any container dies (exit code, OOM, last output lines) in
  # ./logs/container-deaths.log. Restarts are done by the `restart:` policies.
  death-logger:
    image: m.daocloud.io/docker.io/library/docker:cli
    container_name: death-logger
    restart: unless-stopped
    entrypoint: ["sh", "/docker-death-logger.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-death-logger.sh:/docker-death-logger.sh:ro
      - ./logs:/logs
