name: Daily Backup

permissions: {}

on:
  schedule:
    # Runs at 1 AM Beijing Time (UTC+8) every day.
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(vars.DEPLOYMENT_MATRIX) }}

    steps:
      - name: Configure SSH key
        id: ssh_config
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          HOSTNAME: ${{ matrix.hostname }}
          SSH_USERNAME: ${{ vars.SSH_USERNAME }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            host_key_checking="yes"
          else
            # Set vars.SSH_KNOWN_HOSTS to enforce strict host key checking.
            host_key_checking="accept-new"
          fi
          {
            printf 'Host %s\n' "$HOSTNAME"
            printf '  User %s\n' "$SSH_USERNAME"
            printf '  IdentityFile ~/.ssh/id_rsa\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking %s\n' "$host_key_checking"
          } > ~/.ssh/config

      - name: Execute Backup on Server
        env:
          HOSTNAME: ${{ matrix.hostname }}
          SSH_USERNAME: ${{ vars.SSH_USERNAME }}
          WHITE_LABELS: ${{ matrix.white_labels }}
        run: |
          set -euo pipefail
          remote_cmd="bash -s -- $(printf '%q' "$WHITE_LABELS")"
          ssh -- "${SSH_USERNAME}@${HOSTNAME}" "$remote_cmd" <<'EOF'
          set -euo pipefail
          umask 077

          work_dir=$(mktemp -d "${HOME}/backups.XXXXXX")
          trap 'rm -rf "$work_dir"' EXIT

          # To decrypt a backup file locally:
          #   DATABASE_BACKUP_KEY=... openssl enc -d -aes-256-cbc \
          #     -pbkdf2 -iter 600000 -md sha256 \
          #     -pass env:DATABASE_BACKUP_KEY \
          #     -in backup_<wl>.sql.gz.enc -out backup_<wl>.sql.gz
          read -ra labels <<< "$1"
          uri_re='^([a-zA-Z][a-zA-Z0-9+.-]*://[^/:@/?]+):([^@/?]*)@(.*)$'

          for white_label in "${labels[@]}"; do
            if [[ ! "$white_label" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "Invalid white_label: $white_label" >&2
              exit 1
            fi

            env_file="${HOME}/app/.env.${white_label}"
            [ -e "$env_file" ] || continue

            unset DATABASE_URI DATABASE_BACKUP_KEY PGPASSWORD PSQL_URI

            DATABASE_URI=$(
              (sudo grep '^DATABASE_URI=' "$env_file" || true) |
                tail -n 1 |
                sed -e 's/^DATABASE_URI=//' -e 's/\r$//' \
                  -e "s/^'//;s/'$//" -e 's/^"//;s/"$//'
            )
            DATABASE_BACKUP_KEY=$(
              (sudo grep '^DATABASE_BACKUP_KEY=' "$env_file" || true) |
                tail -n 1 |
                sed -e 's/^DATABASE_BACKUP_KEY=//' -e 's/\r$//' \
                  -e "s/^'//;s/'$//" -e 's/^"//;s/"$//'
            )

            if [ -n "$DATABASE_URI" ] && [ -n "$DATABASE_BACKUP_KEY" ]; then
              echo "Backing up database for $white_label"

              PSQL_URI="$DATABASE_URI"
              if [[ "$DATABASE_URI" =~ $uri_re ]]; then
                raw_pass="${BASH_REMATCH[2]}"
                raw_pass="${raw_pass//\\/\\\\}"
                printf -v PGPASSWORD '%b' "${raw_pass//%/\\x}"
                export PGPASSWORD
                PSQL_URI="${BASH_REMATCH[1]}@${BASH_REMATCH[3]}"
              fi

              export DATABASE_BACKUP_KEY
              out_file="${work_dir}/backup_${white_label}.sql.gz.enc"

              # Stream directly through gzip and OpenSSL so plaintext SQL
              # never touches disk and secrets never appear in argv.
              pg_dump "$PSQL_URI" -F p -b |
                gzip -c |
                openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
                  -md sha256 -pass env:DATABASE_BACKUP_KEY -out "$out_file"

              # Compute detached Encrypt-then-MAC HMAC-SHA256 tag for
              # ciphertext integrity verification without exposing key in argv.
              if command -v python3 >/dev/null 2>&1; then
                python3 - "$out_file" <<'PYEOF'
          import hashlib, hmac, os, sys
          path = sys.argv[1]
          key = hashlib.sha256(
              b"backup-hmac:" + os.environ["DATABASE_BACKUP_KEY"].encode()
          ).digest()
          mac = hmac.new(key, digestmod=hashlib.sha256)
          with open(path, "rb") as f:
              for chunk in iter(lambda: f.read(65536), b""):
                  mac.update(chunk)
          with open(path + ".hmac", "w", encoding="utf-8") as f:
              f.write(mac.hexdigest() + "\n")
          PYEOF
              fi

              unset DATABASE_URI DATABASE_BACKUP_KEY PGPASSWORD PSQL_URI
            else
              echo "Skipping $env_file: backup variables not configured."
            fi
          done

          tar -cf "${HOME}/all_backups.tar" -C "$work_dir" .
          EOF

      - name: Download Backup Archive
        env:
          HOSTNAME: ${{ matrix.hostname }}
          SSH_USERNAME: ${{ vars.SSH_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          scp -- "${SSH_USERNAME}@${HOSTNAME}:~/all_backups.tar" \
            ./all_backups.tar

      - name: Clean up remote backup archive
        if: always() && steps.ssh_config.outcome == 'success'
        env:
          HOSTNAME: ${{ matrix.hostname }}
          SSH_USERNAME: ${{ vars.SSH_USERNAME }}
        run: |
          set -euo pipefail
          ssh -- "${SSH_USERNAME}@${HOSTNAME}" "rm -f ~/all_backups.tar"

      # NOTE: Because this repository is public, migrate backup storage off
      # GitHub Actions artifacts to a private object bucket (e.g., Aliyun OSS
      # or S3) once provisioned.
      - name: Upload Backup to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: database-backups-${{ matrix.host_id }}
          path: all_backups.tar
          retention-days: 30
