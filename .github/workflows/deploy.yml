name: Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: yuanjian
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yuanjian
        ports:
          - 5432:5432
        # Wait for the database to be ready before running tests.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '26'
        cache: 'yarn'

    - name: Install Dependencies
      run: yarn install --frozen-lockfile

    - name: Lint and Typecheck
      run: |
        yarn lint
        npx next typegen
        npx tsc -p tsconfig.build.json --noEmit

    - name: Setup Database and Environment
      run: |
        echo "DATABASE_URI=postgres://yuanjian:password@localhost:5432/yuanjian" > .env
        echo "NEXTAUTH_SECRET=123" >> .env
        npx ts-node --require tsconfig-paths/register tools/migrateDatabase.ts

    - name: Run Tests
      run: yarn test

    - name: Generate Demo Data
      run: yarn gen-demo-data

  prepare:
    runs-on: ubuntu-latest
    outputs:
      white_labels: ${{ steps.extract.outputs.white_labels }}
    steps:
      - name: Extract white labels
        id: extract
        run: |
          echo '${{ vars.DEPLOYMENT_MATRIX }}' > matrix.json
          jq -r '[.include[].white_labels | split(" ")] | flatten | unique' matrix.json | jq -c . > labels.json
          echo "white_labels=$(cat labels.json)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: [test, prepare]
    strategy:
      matrix:
        white_label: ${{ fromJSON(needs.prepare.outputs.white_labels) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # AWS-backed GHA runners suffer TCP Cubic collapse (~20 KB/s per stream)
    # over the trans-Pacific link to Aliyun Hangzhou ACR. Switching the host
    # kernel to BBR + fq and sharing host networking with Buildx avoids this.
    - name: Enable TCP BBR congestion control
      run: |
        if sudo modprobe tcp_bbr 2>/dev/null; then
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: |
          network=host

    - name: Log in to Docker
      run: echo "${{ secrets.DOCKER_REPO_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_REPO_USERNAME }} ${{ vars.DOCKER_REPO_URL }} --password-stdin

    # Build and push the Docker image.
    # Uses GitHub Actions native caching (`type=gha`) to significantly reduce
    # Docker compile time by caching layers directly in the GHA cache backend.
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ vars.REMOTE_APP_IMAGE_BASE_NAME }}:${{ matrix.white_label }}
        target: runner
        # Disable OCI provenance attestations to avoid
        # "unknown manifest class" errors on Aliyun's ACR Personal
        # Edition, which doesn't support OCI manifests.
        provenance: false
        build-args: |
          NEXT_PUBLIC_WHITE_LABEL=${{ matrix.white_label }}
        cache-from: type=gha,scope=docker-build-${{ matrix.white_label }}
        cache-to: type=gha,mode=max,scope=docker-build-${{ matrix.white_label }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(vars.DEPLOYMENT_MATRIX) }}

    steps:
    - name: Install SSH client
      run: sudo apt-get install -y openssh-client

    - name: Add SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        known_hosts: ${{ matrix.hostname }}
        config: |
          Host ${{ matrix.hostname }}
            User ${{ vars.SSH_USERNAME }}
            StrictHostKeyChecking no

    - name: Deploy to server
      env:
        APP_IMAGE_BASE_NAME: ${{ vars.LOCAL_APP_IMAGE_BASE_NAME }}
      run: |
        ssh ${{ vars.SSH_USERNAME }}@${{ matrix.hostname }} << 'EOF'
          set -e
          cd ~/app

          echo ">>> Pulling docker images"
          for white_label in ${{ matrix.white_labels }}; do
            sudo docker pull ${{ env.APP_IMAGE_BASE_NAME }}:$white_label
          done
          sudo docker pull m.daocloud.io/docker.io/library/nginx:latest

          echo ">>> Extracting docker-compose.yml & nginx.conf"
          sudo docker rm temp_extract || true
          # Any white label image will do, we use the first one from the matrix
          first_wl=$(echo "${{ matrix.white_labels }}" | awk '{print $1}')
          sudo docker create --name temp_extract \
            ${{ env.APP_IMAGE_BASE_NAME }}:$first_wl
          sudo docker cp temp_extract:/app/docker-compose.${{ matrix.host_id }}.yml ./docker-compose.yml
          sudo docker cp temp_extract:/app/nginx.${{ matrix.host_id }}.conf ./nginx.conf
          sudo docker cp temp_extract:/app/nginx.proxy.conf ./nginx.proxy.conf
          sudo docker cp temp_extract:/app/nginx.ssl.conf ./nginx.ssl.conf
          # Used by the host docker-death-logger systemd service
          sudo docker cp temp_extract:/app/docker-death-logger.sh \
            ./docker-death-logger.sh
          sudo chown root:root ./docker-death-logger.sh
          sudo chmod 700 ./docker-death-logger.sh
          sudo docker rm temp_extract

          echo ">>> Restarting Docker containers"
          sudo APP_IMAGE_BASE_NAME=${{ env.APP_IMAGE_BASE_NAME }} docker compose down --remove-orphans

          echo ">>> Configuring docker-death-logger systemd service"
          app_dir="$(pwd)"
          unit_path='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin'
          unit_path="${unit_path}:/sbin:/bin:/snap/bin"
          unit_file='/etc/systemd/system/docker-death-logger.service'
          printf '%s\n' \
            '[Unit]' \
            'Description=Docker container death logger' \
            'After=network.target docker.service' \
            'After=snap.docker.dockerd.service' \
            '' \
            '[Service]' \
            'Type=simple' \
            "WorkingDirectory=${app_dir}" \
            'Environment="HOME=/root"' \
            "Environment=\"PATH=${unit_path}\"" \
            "Environment=\"LOG_FILE=${app_dir}/logs/container-deaths.log\"" \
            'Environment="STATE_DIR=/run/docker-death-logger"' \
            'RuntimeDirectory=docker-death-logger' \
            'RuntimeDirectoryMode=0700' \
            'UMask=0077' \
            "ExecStart=/bin/sh \"${app_dir}/docker-death-logger.sh\"" \
            'Restart=always' \
            'RestartSec=5' \
            '' \
            '[Install]' \
            'WantedBy=multi-user.target' \
            | sudo tee "$unit_file" >/dev/null
          sudo chown root:root "$unit_file"
          sudo chmod 644 "$unit_file"
          sudo systemctl daemon-reload
          sudo systemctl enable docker-death-logger.service
          sudo systemctl restart docker-death-logger.service

          sudo APP_IMAGE_BASE_NAME=${{ env.APP_IMAGE_BASE_NAME }} docker compose up -d

          echo ">>> Waiting for containers to boot up"
          sleep 5

          for white_label in ${{ matrix.white_labels }}; do
            env_file=".env.$white_label"
            echo ">>> Migrating $white_label database"
            export $(sudo cat $env_file | xargs)
            curl --fail-with-body -X POST -H "Authorization: Bearer ${INTEGRATION_AUTH_TOKEN}" ${NEXTAUTH_URL}/api/v1/migration.migrateDatabase
          done

          echo ">>> Prune Docker images"
          sudo docker image prune -a -f
        EOF
