name: Every 5m Sync Meetings

permissions: {}

on:
  schedule:
    # Runs every 5 minutes (the shortest interval GitHub Actions supports).
    # Because GitHub Actions treats `schedule` as best-effort and frequently
    # delays or drops scheduled runs under platform load, scheduling every 5
    # minutes helps achieve an actual run frequency closer to every 10 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run_scheduled_task:
    uses: ./.github/workflows/run-curl.yml
    with:
      cron_tasks: "cron.syncMeetings"
    secrets: inherit
