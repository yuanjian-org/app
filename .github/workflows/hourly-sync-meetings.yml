name: Every 10m Sync Meetings

permissions: {}

on:
  # Triggered every 10 minutes by cron-job.org via `workflow_dispatch` because
  # GitHub Actions' native `schedule` trigger frequently delays or drops runs
  # under load. See `docs/Deployment.md` ("4. Configure cron-job.org triggers")
  # for setup instructions.
  workflow_dispatch:

jobs:
  run_scheduled_task:
    uses: ./.github/workflows/run-curl.yml
    with:
      cron_tasks: "cron.syncMeetings"
    secrets: inherit
