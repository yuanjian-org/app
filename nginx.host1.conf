server_tokens off;

# Reject HTTPS connections with unknown SNI or Host header
server {
    listen                  443 ssl default_server;
    listen                  [::]:443 ssl default_server;
    server_name             _;
    ssl_reject_handshake    on;
    return                  444;
}

# yuantuapp.com
server {
    include                 /etc/nginx/ssl_params.conf;
    server_name             yuantuapp.com;
    ssl_certificate         /etc/letsencrypt/live/yuantuapp.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/yuantuapp.com/privkey.pem;

    location / {
        proxy_pass "http://yuantu:3000/";
        include /etc/nginx/proxy_params.conf;
    }

    error_page   500 502 503 504  /50x.html;
}

# x.yuantuapp.com
server {
    include                 /etc/nginx/ssl_params.conf;
    server_name             x.yuantuapp.com;
    ssl_certificate         /etc/letsencrypt/live/x.yuantuapp.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/x.yuantuapp.com/privkey.pem;

    location / {
        proxy_pass "http://xx:3000/";
        include /etc/nginx/proxy_params.conf;
    }

    error_page   500 502 503 504  /50x.html;
}

# Redirect http to https & support Let's Encrypt challenge for known hosts
server {
    listen                  80;
    listen                  [::]:80;
    server_name             yuantuapp.com x.yuantuapp.com;

    # https://letsencrypt.org/docs/challenge-types/#http-01-challenge
    # Also see docker-compose.yml.
    location /.well-known/acme-challenge/ {
        root                /var/www/certbot;
    }

    location / {
        return              301 https://$host$request_uri;
    }
}

# Reject unknown Host headers on HTTP (while allowing ACME challenges when
# onboarding new domains)
server {
    listen                  80 default_server;
    listen                  [::]:80 default_server;
    server_name             _;

    location /.well-known/acme-challenge/ {
        root                /var/www/certbot;
    }

    location / {
        return              444;
    }
}
