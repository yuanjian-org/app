services:
  demo:
    image: ${APP_IMAGE_BASE_NAME:?}.demo:latest
    container_name: demo
    restart: always
    env_file: .env.demo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  xhef:
    image: ${APP_IMAGE_BASE_NAME:?}.xhef:latest
    container_name: xhef
    restart: always
    env_file: .env.xhef
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: m.daocloud.io/docker.io/library/nginx:latest
    container_name: nginx
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.proxy.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx.ssl.conf:/etc/nginx/ssl_params.conf:ro
      - ./certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - demo
      - xhef
  autoheal:
    image: m.daocloud.io/docker.io/library/docker:cli
    container_name: autoheal
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        echo "Starting autoheal monitor..."
        last_reboot=0
        docker events \
          --filter "type=container" \
          --filter "event=die" \
          --filter "container=demo" \
          --filter "container=xhef" \
          --filter "container=nginx" | while read -r event_line; do
            now=$$(date +%s)
            if [ $$((now - last_reboot)) -ge 15 ]; then
              echo "Container failure event detected: $$event_line"
              echo "Rebooting stack containers..."
              last_reboot=$$now
              docker restart demo xhef nginx || true
            fi
          done
